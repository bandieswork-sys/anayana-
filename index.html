<style>
/* Layout: one full-width screen. Left: title, calendar / archive. Right top: tracking. Right bottom: scrolling timeline with tasks. Stacks on phones. */
:root {
  --bg: #FFFFFF;
  --panel: #F7F7FA;
  --surface: #FFFFFF;
  --ink: #1B1B20;
  --muted: #6A6A75;
  --line: #E5E5EA;
  --hover: #F1F1F5;
  --accent: #D9480F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE9DB;
  --work: #9B7FE6;
  --work-ink: #5A3EB4;
  --work-soft: #F1EBFD;
  --focus: #D9480F;
  --g: 16px;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
/* White by default. The "Dark mode" button on the page sets data-theme="dark". */
:root[data-theme="dark"] {
  --bg: #121214;
  --panel: #17171B;
  --surface: #1E1E24;
  --ink: #ECECF1;
  --muted: #9C9CA8;
  --line: #2D2D35;
  --hover: #26262E;
  --accent: #FF8A3D;
  --accent-ink: #1A0F05;
  --accent-soft: #3A2514;
  --work: #A98BF0;
  --work-ink: #C9B8FA;
  --work-soft: #2A2142;
  --focus: #FF8A3D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  padding: 0;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--panel);
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font: 500 11.5px/1.3 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
button { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.btn {
  font: 500 13px/1 var(--mono); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--work); color: var(--work-ink); }

/* Frame */
.app { display: block; }
.left, .track, .plan {
  padding-left: max(var(--g), env(safe-area-inset-left, 0px));
  padding-right: max(var(--g), env(safe-area-inset-right, 0px));
}
.left { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 24px 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.right { min-width: 0; }
.track { padding-block: 24px 20px; border-bottom: 1px solid var(--line); }
.plan { padding-block: 0 40px; }

/* Left column */
.brand-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font: 700 clamp(36px, 9vw, 60px)/0.98 var(--display); letter-spacing: -0.03em; margin: 12px 0 0; text-wrap: balance; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.tab { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 9px 10px; cursor: pointer; font: 500 13px/1 var(--mono); letter-spacing: 0.04em; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab .cnt { margin-left: 6px; opacity: 0.8; }
.left-body { min-width: 0; }
.left-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.left-foot .status { flex-basis: 100%; font: 400 12.5px var(--mono); color: var(--muted); }
#copybox { width: 100%; min-height: 150px; font: 400 12.5px/1.5 var(--mono); }
.sync { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.sync[hidden] { display: none; }
.sync-title { margin: 0; font: 700 16px/1.2 var(--display); }
.sync-copy { margin: 0; color: var(--muted); font-size: 12.5px; }
.sync-form { display: grid; gap: 8px; }
.sync-form input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: 13px var(--body); }
.sync-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sync-error { margin: 0; color: var(--accent); font-size: 12px; }

/* Calendar */
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.cal-title { font: 700 20px/1 var(--display); letter-spacing: -0.01em; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn:disabled:hover { border-color: var(--line); }
.cell.adj { opacity: 0.8; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.dow { font: 500 10.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0 2px 2px; }
.cell {
  position: relative; overflow: hidden;
  display: grid; align-content: start; gap: 4px;
  min-height: 78px; padding: 8px 6px 13px; text-align: left;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.cell:hover { border-color: var(--muted); }
.cell .dn { font: 700 18px/1 var(--display); }
.cell .dl { font: 500 10.5px/1.2 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
.cell .wm { font: 500 10.5px/1.2 var(--mono); color: var(--work-ink); }
.cell .fill { position: absolute; left: 0; bottom: 0; height: 5px; width: var(--p, 0%); background: var(--accent); }
.cell.off { background: transparent; border-style: dashed; cursor: default; color: var(--muted); opacity: 0.55; }
.cell.off:hover { border-color: var(--line); }
.cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell.off.today { opacity: 1; border-style: solid; }
.cell[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cell[aria-current="true"] .dl, .cell[aria-current="true"] .wm { color: inherit; opacity: 0.8; }
.cal-note { margin: 12px 0 0; font-size: 13px; color: var(--muted); max-width: 60ch; }

/* Archive */
.arc-list { display: grid; gap: 8px; }
.arc-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.arc-item.on { border-color: var(--ink); }
.arc-open { display: grid; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.arc-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.arc-top b { font: 700 17px/1.2 var(--display); }
.arc-top .mono { font-size: 12.5px; color: var(--muted); }
.badge { margin-left: auto; font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.badge.full { background: var(--accent); color: var(--accent-ink); }
.arc-wins { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14.5px; }
.arc-wins li::before { content: "✓ "; color: var(--accent); font-weight: 700; }
.arc-note { margin: 0; font-size: 13.5px; color: var(--muted); }
.arc-empty { margin: 0; font: 700 18px/1.2 var(--display); }

/* Tracking */
.trk-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
h2 { font: 700 clamp(34px, 5vw, 56px)/0.95 var(--display); letter-spacing: -0.03em; margin: 8px 0 0; }
.phase { font: 500 12px/1.4 var(--mono); letter-spacing: 0.1em; color: var(--accent); margin: 0; text-transform: uppercase; }
.trk-meta { display: grid; gap: 10px; justify-items: end; }
.datef { font-size: 13px; color: var(--muted); }
.nav { display: flex; gap: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
.tile { background: var(--panel); border-radius: 12px; padding: 14px 16px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tv { font: 700 28px/1.1 var(--display); letter-spacing: -0.02em; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.ts { margin: 0 0 6px; font: 400 12.5px/1.3 var(--mono); color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--accent); transition: width 0.3s ease; }
.spark { margin-top: 20px; }
.sbars { display: grid; gap: 2px; align-items: start; margin-top: 10px; }
.sb { display: grid; grid-template-rows: 64px auto; gap: 6px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--muted); }
.sb i { align-self: end; display: block; height: calc(var(--h, 0) * 0.64px); min-height: 3px; border-radius: 3px 3px 1px 1px; background: var(--accent); }
.sb i.z { background: var(--line); }
.sb span { font: 500 10.5px/1 var(--mono); text-align: center; min-height: 12px; white-space: nowrap; }
.sb.on span { color: var(--ink); font-weight: 700; }
.sb.on i { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Glance bar */
.glance { padding-block: 22px 8px; background: var(--bg); }
.gbar { position: relative; height: 30px; margin-top: 10px; }
.seg {
  position: absolute; top: 0; bottom: 0; padding: 0; cursor: pointer;
  border: 0; border-right: 2px solid var(--bg);
  background: var(--line);
}
.seg:first-child { border-radius: 8px 0 0 8px; }
.seg.part { background: var(--accent-soft); box-shadow: inset 0 -4px 0 var(--accent); }
.seg.full { background: var(--accent); }
.seg.work { background: var(--work-soft); box-shadow: inset 0 0 0 2px var(--work); }
.seg.work.part { box-shadow: inset 0 0 0 2px var(--work), inset 0 -6px 0 var(--work); }
.seg.work.full { background: var(--work); }
.now { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); pointer-events: none; }
.gaxis { position: relative; height: 18px; margin-top: 6px; font: 500 11px/1 var(--mono); color: var(--muted); }
.gaxis span { position: absolute; transform: translateX(-50%); }

/* Timeline */
.tl { list-style: none; margin: 14px 0 0; padding: 0; }
.blk { display: grid; grid-template-columns: 76px 18px minmax(0, 1fr); grid-template-areas: "when rail main"; gap: 0 16px; padding-block: 12px; scroll-margin-top: 16px; }
.when { grid-area: when; font: 500 14px/1.3 var(--mono); font-variant-numeric: tabular-nums; padding-top: 3px; }
.when .to { display: block; color: var(--muted); font-size: 12.5px; }
.rail { grid-area: rail; position: relative; }
.rail::before { content: ""; position: absolute; left: 50%; top: -12px; bottom: -12px; width: 2px; margin-left: -1px; background: var(--line); }
.tl > .blk:first-child .rail::before { top: 12px; }
.tl > .blk:last-child .rail::before { bottom: auto; height: 24px; }
.dot { position: absolute; left: 50%; top: 5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--muted); background: var(--bg); z-index: 1; }
.blk.partial .dot { border-color: var(--accent); background: var(--accent-soft); }
.blk.complete .dot { border-color: var(--accent); background: var(--accent); }
.blk.work .dot { border-color: var(--work); }
.blk.work.partial .dot { background: var(--work-soft); }
.blk.work.complete .dot { background: var(--work); }
.main { grid-area: main; min-width: 0; padding-bottom: 12px; }
.bh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.bt { min-width: 0; }
.kicker { font: 500 11.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h3 { font: 700 21px/1.2 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.bright { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bc { font: 500 13px var(--mono); color: var(--muted); }
.bc.full { color: var(--accent); }
.lead { margin: 10px 0 0; font-weight: 600; }
.items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 1px; }
.items li.group { font: 500 11.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
.items label {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 8px 10px; margin-inline: -10px;
  border-radius: 8px; cursor: pointer; min-height: 40px;
}
.items label:hover { background: var(--hover); }
.items span { min-width: 0; padding-top: 1px; }
.items li.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  flex: none; width: 22px; height: 22px; margin: 1px 0 0;
  border: 1.5px solid var(--muted); border-radius: 6px;
  background: var(--surface);
  display: grid; place-content: center; cursor: pointer;
}
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after {
  content: ""; width: 6px; height: 11px;
  border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0;
  transform: translate(0, -1px) rotate(45deg);
}
.note { color: var(--muted); font-size: 14.5px; margin: 12px 0 0; max-width: 62ch; }
.field { display: grid; gap: 8px; margin-top: 16px; }
.field label.cap, .field .cap { font: 500 11.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
textarea, input[type="text"] {
  width: 100%; font: 400 16px/1.5 var(--body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { resize: vertical; min-height: 84px; }
::placeholder { color: var(--muted); opacity: 0.8; }
.blk.work .main { background: var(--work-soft); border-radius: 14px; padding: 18px 20px; }
.blk.work .kicker { color: var(--work-ink); }
.tag { display: inline-block; font: 500 11.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--work-ink); border: 1px solid var(--work); border-radius: 99px; padding: 5px 9px; }
.timer { display: inline-flex; align-items: center; gap: 8px; }
.tdisp { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }

/* Phones: stack calendar, tracking, timeline */
@media (max-width: 560px) {
  .blk { grid-template-columns: 18px minmax(0, 1fr); grid-template-areas: "rail when" "rail main"; gap: 4px 12px; }
  .when { display: flex; gap: 6px; padding-top: 3px; }
  .when .to { display: inline; font-size: 14px; }
  .when .to::before { content: "– "; }
  .blk.work .main { padding: 16px; }
  .cal-grid { gap: 4px; }
  .cell { min-height: 68px; padding: 7px 4px 12px; }
  .cell .dn { font-size: 16px; }
  .sbars { gap: 1px; }
  .trk-meta { justify-items: start; }
}

/* Desktop: the whole app fits one screen */
@media (min-width: 900px) and (min-height: 640px) {
  :root { --g: 32px; }
  html, body { height: 100%; overflow: hidden; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
  .left { height: 100%; overflow: hidden; border-bottom: 0; border-right: 1px solid var(--line); padding-right: var(--g); padding-block: 28px 20px; }
  .left-body { flex: 1; min-height: 0; overflow: auto; }
  .right { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .track, .plan { padding-left: var(--g); }
  .track { padding-block: 28px 22px; }
  .plan { overflow: auto; min-height: 0; padding-block: 0 48px; }
  .glance { position: sticky; top: 0; z-index: 3; }
  .blk { scroll-margin-top: 96px; }
  h1 { font-size: clamp(48px, 6vw, 92px); }
  .left { gap: 22px; }
  .tab { padding: 12px 10px; font-size: 14px; }
  .cal-grid { gap: 6px; }
  .cell { min-height: clamp(64px, 9.5vh, 120px); padding: 9px 10px 14px; gap: 4px; border-radius: 12px; }
  .cell .dn { font-size: clamp(20px, 2vw, 30px); }
  .cell .dl, .cell .wm { font-size: 12px; }
  .dow { font-size: 12px; padding-bottom: 4px; }
  .arc-item { padding: 16px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar i { transition: none; }
}
</style>

    h += '<i class="now" id="nowmark" hidden></i></div><div class="gaxis">';
    [9, 12, 15, 18, 21].forEach(function (hr) {
      h += '<span style="left:' + ((hr * 60 - G0) / (G1 - G0) * 100).toFixed(3) + '%">' + pad(hr) + ":00</span>";
    });
    return h + "</div></div>";
  }

  function updateNow() {
    var el = document.getElementById("nowmark");
    if (!el) return;
    var n = new Date(), m = n.getHours() * 60 + n.getMinutes();
    if (sel === todayIndex() && m >= G0 && m <= G1) {
      el.style.left = ((m - G0) / (G1 - G0) * 100).toFixed(3) + "%";
      el.hidden = false;
    } else {
      el.hidden = true;
    }
  }

  function blockHTML(b, d) {
    var li = "";
    b.items.forEach(function (it, i) {
      if (typeof it !== "string") { li += '<li class="group">' + esc(it.g) + "</li>"; return; }
      var k = "d" + d + "_" + b.id + "_" + i;
      li += '<li><label><input type="checkbox" data-k="' + k + '"' + (state.checks[k] ? " checked" : "") + "><span>" + esc(it) + "</span></label></li>";
    });
    var timer = "";
    if (b.timer) {
      timer = '<div class="timer" data-tid="' + b.id + '" data-mins="' + b.timer + '">' +
        '<span class="tdisp">' + pad(b.timer) + ':00</span>' +
        '<button class="btn" type="button" data-tact="toggle">Start</button>' +
        '<button class="btn" type="button" data-tact="reset" aria-label="Reset timer">Reset</button></div>';
    }
    var field = "";
    if (b.field === "note") {
      field = '<div class="field"><label class="cap" for="note-' + d + '">What\'s bothering me</label>' +
        '<textarea id="note-' + d + '" data-note="' + d + '" placeholder="Write it here instead of carrying it.">' + esc(state.notes["d" + d] || "") + "</textarea></div>";
    } else if (b.field === "wins") {
      var w = state.wins["d" + d] || ["", "", ""];
      field = '<div class="field"><span class="cap">Three things I completed</span>';
      for (var j = 0; j < 3; j++) {
        field += '<input type="text" id="win-' + d + "-" + j + '" data-win="' + d + "." + j + '" aria-label="Completed thing ' + (j + 1) + '" placeholder="' + (j + 1) + '." value="' + esc(w[j] || "") + '">';
      }
      field += "</div>";
    }
    return '<li class="blk' + (b.kind === "work" ? " work" : "") + '" data-b="' + b.id + '">' +
      '<div class="when"><span>' + b.s + '</span><span class="to">' + b.e + "</span></div>" +
      '<div class="rail"><i class="dot"></i></div>' +
      '<div class="main"><div class="bh"><div class="bt">' +
      (b.kicker ? '<p class="kicker">' + esc(b.kicker) + "</p>" : "") +
      (b.tag ? '<p class="kicker"><span class="tag">' + esc(b.tag) + "</span></p>" : "") +
      "<h3>" + esc(b.title) + '</h3></div><div class="bright"><span class="bc" data-bc="' + b.id + '"></span>' + timer + "</div></div>" +
      (b.lead ? '<p class="lead">' + esc(b.lead) + "</p>" : "") +
      '<ul class="items">' + li + "</ul>" +
      (b.note ? '<p class="note">' + esc(b.note) + "</p>" : "") +
      field + "</div></li>";
  }

  function renderPanel() {
    var blocks = getBlocks(sel);
    panel.innerHTML = glanceHTML(blocks) +
      '<ol class="tl">' + blocks.map(function (b) { return blockHTML(b, sel); }).join("") + "</ol>";
    panel.scrollTop = 0;
    paintTimers();
    updateNow();
  }

  function dayCount(d) {
    var keys = allKeys(d), n = 0;
    keys.forEach(function (k) { if (state.checks[k]) n++; });
    return { done: n, total: keys.length };
  }
  function workDone(d) {
    var keys = allKeys(d).filter(function (k) { return k.indexOf("_work_") > -1; });
    return keys.length > 0 && keys.every(function (k) { return state.checks[k]; });
  }

  /* Archive: every day with ticks, completed things or a note */
  function activityDays() {
    var out = [];
    for (var d = DAYS; d >= 1; d--) {
      var c = dayCount(d);
      var w = (state.wins["d" + d] || []).filter(Boolean);
      var n = (state.notes["d" + d] || "").trim();
      if (c.done || w.length || n) out.push({ d: d, c: c, w: w, n: n });
    }
    return out;
  }
  function renderArchive() {
    var items = activityDays();
    document.getElementById("arc-cnt").textContent = items.length ? "(" + items.length + ")" : "";
    if (arcEl.hidden) return;
    if (!items.length) {
      arcEl.innerHTML = '<p class="arc-empty">Nothing archived yet.</p><p class="cal-note">Days where you tick a step, write a note or list what you completed are kept here, newest first.</p>';
      return;
    }
    var h = '<div class="arc-list">';
    items.forEach(function (it) {
      var pct = it.c.total ? Math.round(it.c.done / it.c.total * 100) : 0;
      var full = it.c.total > 0 && it.c.done === it.c.total;
      h += '<article class="arc-item' + (it.d === sel ? " on" : "") + '">' +
        '<button class="arc-open" type="button" data-d="' + it.d + '"><span class="arc-top"><b>Day ' + pad(it.d) + '</b><span class="mono">' + esc(fmtDate(dateOf(it.d))) + '</span><span class="badge' + (full ? " full" : "") + '">' + (full ? "Complete" : pct + "%") + '</span></span>' +
        '<span class="bar" style="--p:' + pct + '%"><i></i></span></button>';
      if (it.w.length) {
        h += '<ul class="arc-wins">' + it.w.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
      }
      if (it.n) h += '<p class="arc-note">Note: ' + esc(it.n) + "</p>";
      h += "</article>";
    });
    arcEl.innerHTML = h + "</div>";
  }

  function setTab(t) {
    tab = t;
    calEl.hidden = t !== "cal";
    arcEl.hidden = t !== "arc";
    document.getElementById("tab-cal").setAttribute("aria-selected", t === "cal" ? "true" : "false");
    document.getElementById("tab-arc").setAttribute("aria-selected", t === "arc" ? "true" : "false");
    renderArchive();
  }

  function refresh() {
    var tot = 0, dn = 0, active = 0, workMin = 0, d;
    for (d = 1; d <= DAYS; d++) {
      var c = dayCount(d);
      tot += c.total; dn += c.done;
      if (c.done) active++;
      if (workDone(d)) workMin += WORK[d - 1].m;
      var pct = c.total ? (c.done / c.total) * 100 : 0;
      var cell = calEl.querySelector('.cell[data-d="' + d + '"]');
      if (cell) {
        cell.style.setProperty("--p", pct + "%");
        cell.setAttribute("aria-label", "Day " + d + ", " + fmtDate(dateOf(d)) + ", " + WORK[d - 1].m + " minutes of work, " + c.done + " of " + c.total + " steps done");
      }
      var sb = trackEl.querySelector('.sb[data-d="' + d + '"]');
      if (sb) {
        var bi = sb.querySelector("i");
        bi.style.setProperty("--h", Math.round(pct));
        bi.classList.toggle("z", c.done === 0);
        sb.setAttribute("aria-label", "Day " + d + ", " + Math.round(pct) + " percent done");
      }
    }
    var cd = dayCount(sel), cp = cd.total ? Math.round(cd.done / cd.total * 100) : 0;
    var op = tot ? Math.round(dn / tot * 100) : 0;
    function put(id, v, s, p) {
      var a = document.getElementById(id), b = document.getElementById(id + "s"), c2 = document.getElementById(id + "b");
      if (a) a.textContent = v;
      if (b) b.textContent = s;
      if (c2) c2.style.setProperty("--p", p + "%");
    }
    put("t-day", cd.done + " / " + cd.total, cp + "% of today's steps", cp);
    put("t-all", op + "%", dn + " of " + tot + " steps", op);
    put("t-work", fmtMins(workMin), "of " + fmtMins(PLANNED_MIN) + " planned", PLANNED_MIN ? Math.round(workMin / PLANNED_MIN * 100) : 0);
    put("t-act", active + " / " + DAYS, "days with progress", Math.round(active / DAYS * 100));

    panel.querySelectorAll(".blk").forEach(function (blk) {
      var boxes = blk.querySelectorAll("input[data-k]"), n = 0;
      boxes.forEach(function (bx) {
        if (bx.checked) n++;
        var li = bx.closest("li");
        if (li) li.classList.toggle("done", bx.checked);
      });
      var bc = blk.querySelector(".bc");
      var full = boxes.length > 0 && n === boxes.length, part = n > 0 && !full;
      if (bc) {
        bc.textContent = n + " / " + boxes.length + (full ? " · done" : "");
        bc.classList.toggle("full", full);
      }
      blk.classList.toggle("complete", full);
      blk.classList.toggle("partial", part);
      var seg = panel.querySelector('.seg[data-seg="' + blk.dataset.b + '"]');
      if (seg) { seg.classList.toggle("full", full); seg.classList.toggle("part", part); }
    });
    renderArchive();
  }

  function renderAll() {
    renderHeader();
    renderCalendar();
    renderTrack();
    renderPanel();
    setTab(tab);
    refresh();
  }

  /* ---------- Timer ---------- */
  var timer = { id: null, left: 0, running: false, done: false, end: 0, iv: 0 };
  function fmt(s) { return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
  function stopIv() { if (timer.iv) { clearInterval(timer.iv); timer.iv = 0; } }
  function resetTimer() { stopIv(); timer = { id: null, left: 0, running: false, done: false, end: 0, iv: 0 }; }
  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      var c = new C(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.15, c.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 1.2);
      o.start(); o.stop(c.currentTime + 1.3);
    } catch (e) {}
  }
  function paintTimers() {
    panel.querySelectorAll(".timer").forEach(function (el) {
      var id = el.dataset.tid, mins = +el.dataset.mins, active = timer.id === id;
      var left = active ? timer.left : mins * 60;
      el.querySelector(".tdisp").textContent = active && timer.done ? "Time's up" : fmt(left);
      var tb = el.querySelector('[data-tact="toggle"]');
      tb.textContent = active && timer.running ? "Pause" : (active && !timer.done && timer.left < mins * 60 ? "Resume" : "Start");
    });
  }
  function tick() {
    timer.left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    if (timer.left <= 0) { stopIv(); timer.running = false; timer.done = true; beep(); }
    paintTimers();
  }
  function toggleTimer(id, mins) {
    if (timer.id !== id) { resetTimer(); timer.id = id; timer.left = mins * 60; }
    if (timer.running) { stopIv(); timer.running = false; }
    else {
      if (timer.done) { timer.left = mins * 60; timer.done = false; }
      timer.end = Date.now() + timer.left * 1000;
      timer.running = true;
      timer.iv = setInterval(tick, 250);
    }
    paintTimers();
  }

  /* ---------- Events ---------- */
  function selectDay(d) {
    sel = d;
    view.m = Math.min(11, Math.max(10, dateOf(d).getMonth()));
    resetTimer();
    renderCalendar();
    renderTrack();
    renderPanel();
    refresh();
    if (stacked()) jumpTo(trackEl);
  }
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (b) setTab(b.dataset.tab);
  });
  calEl.addEventListener("click", function (e) {
    var mo = e.target.closest("[data-mo]");
    if (mo && !mo.disabled) {
      view.m = Math.min(11, Math.max(10, view.m + (+mo.dataset.mo)));
      renderCalendar();
      refresh();
      return;
    }
    var b = e.target.closest(".cell[data-d]");
    if (b) selectDay(+b.dataset.d);
  });
  arcEl.addEventListener("click", function (e) {
    var b = e.target.closest(".arc-open[data-d]");
    if (b) selectDay(+b.dataset.d);
  });
  trackEl.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (go) { selectDay(+go.dataset.go); return; }
    var sb = e.target.closest(".sb[data-d]");
    if (sb) selectDay(+sb.dataset.d);
  });
  setInterval(updateNow, 60000);
  panel.addEventListener("click", function (e) {
    var jump = e.target.closest("[data-jump]");
    if (jump) { jumpTo(panel.querySelector('.blk[data-b="' + jump.dataset.jump + '"]')); return; }
    var ta = e.target.closest("[data-tact]");
    if (ta) {
      var wrap = ta.closest(".timer");
      if (ta.dataset.tact === "toggle") toggleTimer(wrap.dataset.tid, +wrap.dataset.mins);
      else { resetTimer(); paintTimers(); }
    }
  });
  panel.addEventListener("change", function (e) {
    var t = e.target;
    if (t.matches && t.matches("input[data-k]")) {
      if (t.checked) state.checks[t.dataset.k] = true; else delete state.checks[t.dataset.k];
      touch();
      refresh();
    }
  });
  panel.addEventListener("input", function (e) {
    var t = e.target;
    if (t.matches && t.matches("textarea[data-note]")) {
      state.notes["d" + t.dataset.note] = t.value;
      touch();
      renderArchive();
    } else if (t.matches && t.matches("input[data-win]")) {
      var p = t.dataset.win.split("."), key = "d" + p[0];
      var arr = (state.wins[key] || ["", "", ""]).slice();
      arr[+p[1]] = t.value;
      state.wins[key] = arr;
      touch();
      renderArchive();
    }
  });

  var copyBtn = document.getElementById("copy");
  var copyBox = document.getElementById("copybox");
  function summary() {
    var out = ["Restart Plan — progress"];
    for (var d = 1; d <= DAYS; d++) {
      var c = dayCount(d);
      out.push("");
      out.push("Day " + pad(d) + " · " + fmtDate(dateOf(d)) + " · " + c.done + "/" + c.total);
      var w = (state.wins["d" + d] || []).filter(Boolean);
      if (w.length) out.push("  Completed: " + w.join("; "));
      var n = (state.notes["d" + d] || "").trim();
      if (n) out.push("  Note: " + n);
    }
    return out.join("\n");
  }
  copyBtn.addEventListener("click", function () {
    var text = summary();
    function fallback() {
      copyBox.hidden = false;
      copyBox.value = text;
      copyBox.focus();
      copyBox.select();
      copyBtn.textContent = "Select and copy below";
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = "Copied";
        setTimeout(function () { copyBtn.textContent = "Copy progress"; }, 1800);
      }, fallback);
    } catch (e) { fallback(); }
  });

  var resetBtn = document.getElementById("reset");
  var resetT = 0;
  resetBtn.addEventListener("click", function () {
    if (!resetBtn.classList.contains("danger")) {
      resetBtn.classList.add("danger");
      resetBtn.textContent = "Tap again to erase all";
      resetT = setTimeout(function () {
        resetBtn.classList.remove("danger");
        resetBtn.textContent = "Reset everything";
      }, 4000);
      return;
    }
    clearTimeout(resetT);
    resetBtn.classList.remove("danger");
    resetBtn.textContent = "Reset everything";
    state = emptyState();
    touch();
    resetTimer();
    renderAll();
  });

  /* Theme: white by default, dark on request, remembered on this device */
  var THEME_KEY = "restart15.theme";
  var themeBtn = document.getElementById("theme");
  function isDark() { return document.documentElement.getAttribute("data-theme") === "dark"; }
  function paintThemeBtn() {
    themeBtn.textContent = isDark() ? "Light mode" : "Dark mode";
    themeBtn.setAttribute("aria-pressed", isDark() ? "true" : "false");
  }
  try {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) {}
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    paintThemeBtn();
  });
  paintThemeBtn();

  renderAll();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});
  initRemote();
})();
</script>

</body></html>
